<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medium Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="medium.css">
</head>
<body>
  <header class="header">
    <a href="#" class="logo">Medium</a>
    <nav class="nav">
      <a href="#">Our Story</a>
      <a href="#">Membership</a>
      <a href="#">Write</a>
      <a href="#">Sign in</a>
      <a href="#" class="btn-start">Get started</a>
      <button id="theme-toggle" class="btn-dark">Dark</button>
    </nav>
  </header>

  <main class="main">
    <div class="hero-text">
      <h1>Human<br>stories & ideas</h1>
      <p>A place to read, write, and deepen your understanding</p>
      <a href="#" class="link-start">Start reading</a>
    </div>
    <div class="hero-image">
      <img src="https://miro.medium.com/v2/format:webp/4*SdjkdS98aKH76I8eD0_qjw.png" alt="Medium illustration">
    </div>
  </main>

  <footer class="footer">
    <a href="#" class="has-tooltip" data-tooltip="Help Center - Get support">Help</a>
    <a href="#" class="has-tooltip" data-tooltip="Check system status">Status</a>
    <a href="#" class="has-tooltip" data-tooltip="Learn about Medium">About</a>
    <a href="#" class="has-tooltip" data-tooltip="We're hiring - Join us">Careers</a>
    <a href="#" class="has-tooltip" data-tooltip="Press inquiries and media kit">Press</a>
    <a href="#" class="has-tooltip" data-tooltip="Official Medium Blog">Blog</a>
    <a href="#" class="has-tooltip" data-tooltip="Shop Medium membership & merch">Store</a>
    <a href="#" class="has-tooltip" data-tooltip="Privacy Policy">Privacy</a>
    <a href="#" class="has-tooltip" data-tooltip="Community Rules & Guidelines">Rules</a>
    <a href="#" class="has-tooltip" data-tooltip="Terms of Service">Terms</a>
    <a href="https://speechify.com/medium" class="has-tooltip" data-tooltip="Listen with speechify.com/medium">Text to speech</a>
  </footer>

  <script>
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      document.documentElement.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
